openapi: 3.0.3
info:
  title: Email Deliverability Check API
  version: 1.0.0
  description: Checks whether an email address is registered with its mailbox provider, for one address or a batch of up to 100.
  contact:
    name: EmailCheckPro
    url: https://emailcheckpro.com/products/email
  license:
    name: MIT
    url: https://opensource.org/license/mit
externalDocs:
  description: EmailCheckPro API documentation
  url: https://emailcheckpro.com/api-docs
servers:
  - url: https://emailcheckpro.com
security:
  - ApiKeyAuth: []
paths:
  /api/v1/check:
    post:
      summary: Check one identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_type, identifier]
              properties:
                service_type: { type: string, enum: [email] }
                identifier: { type: string }
      responses:
        '200':
          description: Determined result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleEnvelope' }
        '400': { description: Invalid input }
        '401': { description: Invalid API key }
        '402': { description: Insufficient balance }
        '422': { description: Undetermined, not charged }
        '429': { description: Rate limited or concurrency slots occupied }
  /api/v1/batch-check:
    post:
      summary: Check 1-100 identifiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_type, identifiers]
              properties:
                service_type: { type: string, enum: [email] }
                identifiers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '200':
          description: Ordered results
        '504': { description: Batch timeout, fully refunded }
  /api/v1/balance:
    get:
      summary: Current balance
      responses:
        '200': { description: Balance in data.balance_micros }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    SingleEnvelope:
      type: object
      properties:
        code: { type: integer }
        msg: { type: string }
        data:
          type: object
          properties:
            service_type: { type: string }
            identifier: { type: string }
            registered: { type: boolean }
            provider: { type: string }
