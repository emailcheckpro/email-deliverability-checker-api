openapi: 3.0.3
info:
  title: Email Deliverability Check API
  version: 1.1.0
  description: Synchronous single and batch Email Deliverability Check for email addresses.
  contact:
    name: EmailCheckPro
    url: https://emailcheckpro.com/products/email
  license:
    name: MIT
    url: https://opensource.org/license/mit
externalDocs:
  description: EmailCheckPro API documentation
  url: https://emailcheckpro.com/api-docs
servers:
- url: https://emailcheckpro.com
security:
- ApiKeyAuth: []
paths:
  /api/v1/check:
    post:
      summary: Check one identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - service_type
              - identifier
              properties:
                service_type:
                  type: string
                  enum:
                  - email
                identifier:
                  type: string
      responses:
        '200':
          description: Determined result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleEnvelope'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Undetermined; not charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or concurrency limit; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Maintenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/batch-check:
    post:
      summary: Check 1–100 ordered identifiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - service_type
              - identifiers
              properties:
                service_type:
                  type: string
                  enum:
                  - email
                identifiers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: Ordered per-item results; exists=false means undetermined, not negative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Undetermined; not charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or concurrency limit; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Maintenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Whole synchronous batch timed out; no partial result; fully refunded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/balance:
    get:
      summary: Read balance
      responses:
        '200':
          description: Current balance in USD micros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEnvelope'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      required:
      - code
      - msg
      properties:
        code:
          type: integer
          description: Non-zero API error code.
        msg:
          type: string
      description: An HTTP/API error is not a determined negative result.
    BalanceEnvelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          enum:
          - 0
        msg:
          type: string
        data:
          type: object
          required:
          - balance_micros
          properties:
            balance_micros:
              type: integer
              format: int64
              description: USD micros; 1,000,000 equals USD 1.
    CheckResult:
      type: object
      required:
      - service_type
      - identifier
      - registered
      properties:
        service_type:
          type: string
          enum:
          - email
        identifier:
          type: string
        registered:
          type: boolean
    SingleEnvelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          enum:
          - 0
        msg:
          type: string
        data:
          $ref: '#/components/schemas/CheckResult'
    BatchItem:
      type: object
      required:
      - identifier
      - exists
      properties:
        identifier:
          type: string
        exists:
          type: boolean
          description: false is undetermined; do not classify it as negative.
        registered:
          type: boolean
      description: Product result fields only appear on determined (exists=true) items.
    BatchData:
      type: object
      required:
      - service_type
      - total
      - succeeded
      - failed
      - results
      properties:
        service_type:
          type: string
          enum:
          - email
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
    BatchEnvelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          enum:
          - 0
        msg:
          type: string
        data:
          $ref: '#/components/schemas/BatchData'
